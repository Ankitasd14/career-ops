# Portal Scanner Configuration — Ankita Divekar
# Target: HRBP / HR Manager / AI-Native HR Lead
# Market: India (remote-first) + global remote
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time)
#   2. ATS APIs → structured JSON where available
#   3. WebSearch with site: filters → broad discovery

title_filter:
  positive:
    # Core HRBP / HR roles
    - "HRBP"
    - "HR Business Partner"
    - "HR Manager"
    - "Senior HR Manager"
    - "HR Lead"
    - "HR Director"
    - "Human Resources Manager"
    # People roles
    - "People Partner"
    - "People Operations"
    - "People & Culture"
    - "People Manager"
    - "People Success"
    - "Head of People"
    - "VP People"
    - "VP of People"
    - "Director of People"
    - "Chief People Officer"
    - "CPO"
    # Employee Experience / Relations
    - "Employee Experience"
    - "Employee Relations"
    # Talent (senior context)
    - "Talent Management"
    - "Talent Partner"
    - "Head of Talent"
    # HR Tech / AI HR
    - "HR Technology"
    - "HR Tech"
    - "AI HR"
    - "HR Automation"
    # Org & Workforce
    - "Org Design"
    - "Workforce Planning"
    - "Compensation & Benefits"
    - "Total Rewards"
  negative:
    - "Junior"
    - "Intern"
    - "Internship"
    - "Entry Level"
    - "Fresher"
    - "HR Coordinator"
    - "HR Assistant"
    - "HR Executive"       # usually junior in India
    - "HR Recruiter"
    - "Technical Recruiter"
    - "Talent Sourcer"
    - "Sourcer"
    - "Software Engineer"
    - "Data Engineer"
    - "Product Manager"
    - "Engineering Manager"
    - "Finance Manager"
  seniority_boost:
    - "Senior"
    - "Head"
    - "Lead"
    - "Director"
    - "VP"
    - "Manager"
    - "Principal"
    - "Strategic"
    - "Global"

search_queries:
  # -- Indian job boards (HR-specific) --

  - name: iimjobs — HRBP Senior
    query: 'site:iimjobs.com "HR Business Partner" OR "HRBP" senior OR manager'
    enabled: true

  - name: iimjobs — HR Manager / People Partner
    query: 'site:iimjobs.com "HR Manager" OR "People Partner" OR "Head of People"'
    enabled: true

  - name: iimjobs — AI Native HR / HR Tech
    query: 'site:iimjobs.com "HR Technology" OR "AI HR" OR "People Operations" remote OR hybrid'
    enabled: true

  - name: Instahyre — Senior HR India
    query: 'site:instahyre.com "HRBP" OR "HR Manager" OR "People Partner" senior'
    enabled: true

  - name: Cutshort — Senior HR Startups India
    query: 'site:cutshort.io "HR Business Partner" OR "HR Manager" OR "People Partner" remote OR hybrid'
    enabled: true

  - name: Wellfound — People / HR Startups
    query: 'site:wellfound.com "HR Manager" OR "People Partner" OR "HRBP" OR "Head of People" India remote'
    enabled: true

  # -- ATS boards (global, also used by Indian companies) --

  - name: Greenhouse — HRBP / People roles
    query: 'site:job-boards.greenhouse.io "HR Business Partner" OR "HRBP" OR "People Partner" OR "HR Manager"'
    enabled: true

  - name: Ashby — People Partner / HR roles
    query: 'site:jobs.ashbyhq.com "People Partner" OR "HR Manager" OR "HRBP" OR "Head of People"'
    enabled: true

  - name: Lever — HR / People roles
    query: 'site:jobs.lever.co "HR Business Partner" OR "People Partner" OR "HR Manager" OR "HRBP"'
    enabled: true

  # -- Global remote HR roles --

  - name: Remote.com — HR roles global
    query: 'site:remote.com/jobs "HR Business Partner" OR "People Partner" OR "HR Manager" remote'
    enabled: true

  - name: WeWorkRemotely — People Ops / HR
    query: 'site:weworkremotely.com "HR" OR "People Operations" OR "HRBP" OR "People Partner" remote'
    enabled: true

  - name: Himalayas — Remote HR / People roles
    query: 'site:himalayas.app "HR Business Partner" OR "People Partner" OR "HR Manager" remote'
    enabled: true

  # -- AI-native HR roles --

  - name: AI-native HR — Global remote
    query: '"AI HR" OR "HR Automation" "People Partner" OR "HRBP" OR "HR Manager" remote India'
    enabled: true

  - name: HR Tech companies — People roles
    query: '"People Operations" OR "HRBP" site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com "India" OR "remote" OR "global"'
    enabled: true

